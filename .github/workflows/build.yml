name: Build Calendar Pages

on:
  schedule:
    # GitHub Actions cron has no timezone concept -- it's always UTC. Midnight
    # Pacific is 07:00 UTC during PDT (summer) but 08:00 UTC during PST
    # (winter), so a single fixed UTC hour is only correct for half the year.
    # Firing at both covers midnight Pacific correctly year-round; the
    # "extra" run in the other half of the year is harmless/idempotent since
    # build.py always regenerates from the actual current Pacific date
    # (see build.py's today_local()), and a client-side JS safety net in the
    # generated HTML also self-corrects "today" from the browser's own clock.
    - cron: '0 7,8 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static HTML
        run: python build.py

      - name: Install weather widget build deps
        run: npm ci

      - name: Build weather widget bundle (ES2020->ES2015 downlevel, no ES module dependency)
        run: npm run build:weather

      - name: Deploy weather widget to Deno Deploy (NOT GitHub Pages -- see AGENTS.md)
        run: npm run deploy:weather-widget
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}

      - name: Deploy sunrise/sunset screen switcher to Deno Deploy
        run: npm run deploy:switcher
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}

      - name: Deploy calendar to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
