name: Update NOAA/NHC active storms

on:
  schedule:
    # Once an hour is plenty for hurricane/tropical-storm tracking. NHC updates
    # are not minutely, and this stays far away from GitHub Actions rate limits.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch NOAA/NHC CurrentStorms.json
        run: |
          curl -sL -o docs/noaa_current_storms.json https://www.nhc.noaa.gov/CurrentStorms.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/noaa_current_storms.json
          if git diff --cached --quiet; then
            echo "No NOAA storm changes."
          else
            git commit -m "Update NOAA/NHC active storms"
            git pull --rebase origin main
            git push
          fi
