name: Trigger DAKboard Screen Switcher

# Backup/external scheduler for the Deno Deploy sunrise/sunset switcher.
# The Deno Deploy cron in deno/dakboard-switcher.deno.js is the primary
# mechanism, but this GitHub Actions cron guarantees the /trigger endpoint is
# hit every 15 minutes during the same Pacific sunrise/sunset windows:
#   - 00:00-05:00 UTC  => evening Pacific (5-10pm, depending on DST)
#   - 12:00-16:00 UTC  => morning Pacific (5-9am, depending on DST)
# This keeps the DAKboard on the correct Day/Night screen even if the Deno
# Deploy cron is delayed or fails silently.

on:
  schedule:
    - cron: '*/15 0-5 * * *'
    - cron: '*/15 12-16 * * *'
  workflow_dispatch:

jobs:
  trigger-switcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger DAKboard sunrise/sunset switcher
        run: |
          curl -fsS -m 30 \
            "https://dakboard-switcher.iamflying29-sketch.deno.net/trigger" \
            -o response.json
          cat response.json
          # Fail the workflow if the switcher reported an error.
          test "$(jq -r '.status' response.json)" = "ok"
